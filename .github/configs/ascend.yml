# Huawei Ascend 910C unit-test configuration.
hardware_name: ascend
display_name: Ascend 910C unit tests
paths_watch:
  - .github/scripts/set_env/ascend.sh
  - .github/workflows/unit_tests_common.yml
  - flagcx/adaptor/device/cann_adaptor.cc
  - flagcx/adaptor/include/ascend_adaptor.h
  - flagcx/adaptor/ccl/hccl_adaptor.cc
  - makefiles/ascend.mk
  - test/unittest/adaptor/net_test_utils.h
ci_image: harbor.baai.ac.cn/flagos-dev/flagcx:asend-dev-fixed-20261016
runner_labels:
  - self-hosted
  - ascend
docker_volumes:
  - /usr/local/Ascend/driver:/usr/local/Ascend/driver:ro
  - /usr/local/sbin/npu-smi:/usr/local/sbin/npu-smi:ro
  - /usr/local/dcmi:/usr/local/dcmi:ro
  - /etc/ascend_install.info:/etc/ascend_install.info:ro
  - /sys/class/infiniband:/sys/class/infiniband:ro
  - /sys/bus/pci/devices:/sys/bus/pci/devices:ro
docker_options:
  - --network=host
  - --ipc=host
  - --privileged
  - --device=/dev/davinci_manager
  - --device=/dev/devmm_svm
  - --device=/dev/hisi_hdc
  - --device=/dev/davinci0
  - --device=/dev/davinci1
  - --device=/dev/davinci2
  - --device=/dev/davinci3
  - --device=/dev/davinci4
  - --device=/dev/davinci5
  - --device=/dev/davinci6
  - --device=/dev/davinci7
  - --device=/dev/davinci8
  - --device=/dev/davinci9
  - --device=/dev/davinci10
  - --device=/dev/davinci11
  - --device=/dev/davinci12
  - --device=/dev/davinci13
  - --device=/dev/davinci14
  - --device=/dev/davinci15
  - --mount=type=bind,src=/dev/infiniband,dst=/dev/infiniband
  - --ulimit=memlock=-1
set_env: .github/scripts/set_env/ascend.sh
unit_test_suites:
  - core
  - adaptor
  - service
